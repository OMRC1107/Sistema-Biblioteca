<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sistema de Biblioteca · Mapa de salas</title>
    <meta
      name="description"
      content="Visor de los tres pisos de la biblioteca con búsqueda de salas."
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="marca">
        <svg class="marca-icono" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5v-17zM6.5 4a.5.5 0 0 0-.5.5V17.2a4.5 4.5 0 0 1 .5-.03H18V4H6.5z"
            fill="currentColor"
          />
        </svg>
        <div>
          <h1>Sistema de Biblioteca</h1>
          <p>Mapa de pisos y salas</p>
        </div>
      </div>

      <div class="buscador">
        <label for="busqueda" class="sr-only">Buscar sala</label>
        <svg class="buscador-icono" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"
            fill="currentColor"
          />
        </svg>
        <input
          id="busqueda"
          type="search"
          placeholder="Buscar sala…  (pulsa / para enfocar)"
          autocomplete="off"
          role="combobox"
          aria-expanded="false"
          aria-controls="resultados"
          aria-autocomplete="list"
        />
        <ul id="resultados" class="resultados" role="listbox" hidden></ul>
      </div>

      <div id="cuenta" class="cuenta" aria-live="polite"></div>
    </header>

    <main class="layout">
      <section class="visor" aria-label="Plano de la biblioteca">
        <div class="visor-cabecera">
          <div id="pestanas" class="pestanas" role="tablist" aria-label="Pisos"></div>
          <p id="estado" class="estado" aria-live="polite"></p>
        </div>

        <div class="plano-marco">
          <div class="lienzo" id="lienzo">
            <svg id="plano" role="group" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
          <p id="nota" class="nota"></p>
        </div>

        <ul id="leyenda" class="leyenda" aria-label="Leyenda de categorías"></ul>
      </section>

      <aside class="panel" aria-label="Información de salas">
        <article id="detalle" class="tarjeta detalle" aria-live="polite"></article>

        <section class="tarjeta">
          <h2 id="lista-titulo" class="lista-titulo"></h2>
          <ul id="lista" class="lista"></ul>
        </section>
      </aside>
    </main>

    <section id="sala-panel" class="sala-panel" aria-label="Plano de la sala seleccionada" hidden>
      <div class="sala-cabecera">
        <div class="sala-pestana">
          <span id="sala-punto" class="punto"></span>
          <h2 id="sala-titulo"></h2>
          <button id="sala-cerrar" class="sala-cerrar" type="button" aria-label="Cerrar plano de la sala">×</button>
        </div>
        <p id="sala-meta" class="sala-meta"></p>
      </div>
      <div class="sala-lienzo">
        <svg id="sala-plano" role="group" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="mesa-bloque" class="mesa-bloque" hidden>
        <ul class="mesa-leyenda" aria-label="Estado de las mesas">
          <li><span class="muestra libre"></span>Disponible</li>
          <li><span class="muestra reservada"></span>Reservada</li>
          <li><span class="muestra mia"></span>Reservada por ti</li>
        </ul>
        <div id="mesa-accion" class="mesa-accion" aria-live="polite"></div>
      </div>
    </section>

    <dialog id="dlg-cuenta" class="dialogo" aria-labelledby="dlg-titulo">
      <form id="form-cuenta" novalidate>
        <div class="dlg-cab">
          <h2 id="dlg-titulo">Iniciar sesión</h2>
          <button id="dlg-cerrar" class="sala-cerrar" type="button" aria-label="Cerrar">×</button>
        </div>
        <div id="dlg-modos" class="dlg-modos" role="group" aria-label="Tipo de acceso">
          <button type="button" data-modo="entrar" aria-selected="true">Ya tengo cuenta</button>
          <button type="button" data-modo="registro" aria-selected="false">Crear cuenta</button>
        </div>
        <label class="campo">
          <span>Código (7 cifras)</span>
          <input id="f-codigo" inputmode="numeric" maxlength="7" autocomplete="username" placeholder="1234567" />
        </label>
        <label id="f-nombre-fila" class="campo" hidden>
          <span>Nombre</span>
          <input id="f-nombre" maxlength="60" autocomplete="name" placeholder="Tu nombre" />
        </label>
        <label class="campo">
          <span>Contraseña (mínimo 8 caracteres)</span>
          <input id="f-clave" type="password" maxlength="128" autocomplete="current-password" />
        </label>
        <label class="campo-check"><input id="f-mostrar" type="checkbox" /> Mostrar contraseña</label>
        <p id="f-error" class="dlg-error" role="alert"></p>
        <button id="f-enviar" class="boton primario" type="submit">Iniciar sesión</button>
      </form>
    </dialog>

    <footer class="pie">
      <p>Haz clic en una sala del plano o busca una sala por nombre, número o piso.</p>
    </footer>

    <script src="js/planos.js"></script>
    <script src="js/data.js"></script>
    <script src="js/mesas.js"></script>
    <script src="js/cuenta.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
